<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Success - ShevHeritage</title>
  <link rel="stylesheet" href="css/bootstrap.min.css" type="text/css">
  <link rel="stylesheet" href="css/style.css" type="text/css">
</head>
<body>
  <div id="header-placeholder"></div>

  <section class="checkout spad" style="text-align:center">
    <h2>Thank you for your purchase!</h2>
    <p id="order-info">Processing your order details...</p>
  </section>

  <div id="footer-placeholder"></div>
  <script src="js/partials-loader.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    const infoEl = document.getElementById('order-info');

    async function saveOrder(data) {
      try {
        await fetch('/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId: data.id,
            email: data.customer_details?.email,
            billingDetails: data.metadata ? JSON.parse(data.metadata.billingDetails) : {},
            cart: data.metadata ? JSON.parse(data.metadata.cart) : [],
            status: 'confirmed',
            paid_at: new Date().toISOString()
          })
        });
      } catch (err) {
        console.error('Failed to save order', err);
      }
    }

    if (sessionId) {
      fetch(`/api/checkout-session?sessionId=${sessionId}`)
        .then(r => r.json())
        .then(async data => {
          if (data.id) {
            infoEl.textContent = 'Payment confirmed. Session ID: ' + data.id;
            await saveOrder(data);
            localStorage.removeItem('cart');
          } else {
            infoEl.textContent = 'Unable to load order info.';
          }
        })
        .catch(() => {
          infoEl.textContent = 'Unable to load order info.';
        });
    } else {
      infoEl.textContent = 'No session found.';
    }
  </script>
</body>
</html>
