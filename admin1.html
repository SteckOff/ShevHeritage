<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Управление товарами</title>
  <link rel="stylesheet" href="css/style.css"> <!-- Подключи свои стили -->
  <style>
    /* Базовые стили для админки */
    body { font-family: Arial, sans-serif; margin: 20px; }
    .admin-form { max-width: 600px; margin-bottom: 30px; }
    .admin-form input, .admin-form select { width: 100%; padding: 8px; margin: 5px 0; }
    .admin-form button { padding: 10px 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    table, th, td { border: 1px solid #ccc; }
    th, td { padding: 8px; text-align: left; }
    .action-btn { cursor: pointer; color: red; }
  </style>
</head>
<body>

  <h1>Админка: Управление товарами</h1>
  <div class="admin-form">
    <h2>Добавить новый товар</h2>
    <form id="product-form">
      <label>Название товара</label>
      <input type="text" id="prod-name" required>
      
      <label>Цена ($)</label>
      <input type="number" id="prod-price" step="0.01" required>
      
      <label>Доступное количество</label>
      <input type="number" id="prod-available" required>
      
      <label>Скидка (%) (0 если нет)</label>
      <input type="number" id="prod-discount" value="0" required>
      
      <label>URL картинки</label>
      <input type="text" id="prod-image" required>
      
      <label>Категория</label>
      <input type="text" id="prod-category" placeholder="Например: pod, accessory, disposable" required>
      
      <button type="submit">Добавить товар</button>
    </form>
  </div>

  <h2>Список товаров</h2>
  <table id="products-table">
    <thead>
      <tr>
        <th>Название</th>
        <th>Цена</th>
        <th>Доступно</th>
        <th>Скидка</th>
        <th>Категория</th>
        <th>Картинка</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody>
      <!-- Список товаров будет динамически вставлен сюда -->
    </tbody>
  </table>

<script>
  // Функция для получения товаров из localStorage
  function getProducts() {
    return JSON.parse(localStorage.getItem("products")) || [];
  }

  // Функция для сохранения товаров в localStorage
  function saveProducts(products) {
    localStorage.setItem("products", JSON.stringify(products));
  }

  // Функция для отрисовки списка товаров в админке
  function renderProducts() {
    const products = getProducts();
    const tbody = document.querySelector("#products-table tbody");
    tbody.innerHTML = "";
    products.forEach((prod, index) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${prod.name}</td>
        <td>$${parseFloat(prod.price).toFixed(2)}</td>
        <td>${prod.available}</td>
        <td>${prod.discount}%</td>
        <td>${prod.category}</td>
        <td><img src="${prod.image}" alt="${prod.name}" width="50"></td>
        <td><span class="action-btn" data-index="${index}">Удалить</span></td>
      `;
      tbody.appendChild(tr);
    });
    // Привязываем событие удаления
    document.querySelectorAll(".action-btn").forEach(btn => {
      btn.addEventListener("click", function() {
        const index = this.getAttribute("data-index");
        deleteProduct(index);
      });
    });
  }

  // Функция для удаления товара
  function deleteProduct(index) {
    let products = getProducts();
    products.splice(index, 1);
    saveProducts(products);
    renderProducts();
  }

  // Обработка формы добавления товара
  document.getElementById("product-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const name = document.getElementById("prod-name").value;
    const price = document.getElementById("prod-price").value;
    const available = document.getElementById("prod-available").value;
    const discount = document.getElementById("prod-discount").value;
    const image = document.getElementById("prod-image").value;
    const category = document.getElementById("prod-category").value;
    
    const newProduct = {
      id: Date.now(), // уникальный id
      name,
      price: parseFloat(price),
      available: parseInt(available),
      discount: parseInt(discount),
      image,
      category
    };
    
    let products = getProducts();
    products.push(newProduct);
    saveProducts(products);
    renderProducts();
    this.reset();
  });

  // Инициализация списка товаров при загрузке страницы
  document.addEventListener("DOMContentLoaded", renderProducts);
</script>
</body>
</html>
